name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -short ./...

  sqlc:
    name: sqlc drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # `make sqlc` pins the sqlc version (SQLC_VERSION in the Makefile), so CI
      # and local generation can never disagree.
      - name: Regenerate and check for drift
        run: |
          make sqlc
          git diff --exit-code -- internal/storage/sqlcgen \
            || (echo "::error::sqlc output is stale — run 'make sqlc' and commit" && exit 1)

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned (matches local dev) so a new golangci release can never
          # redden CI without a commit here.
          version: v2.12.2

  web:
    name: Web build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: air-tickets-warden:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
