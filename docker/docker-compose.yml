services:
  warden:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: warden:local
    container_name: warden
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/warden.db
    volumes:
      - ../data:/app/data
    ports:
      - "9090:9090"
    command: >
      sh -c "alembic upgrade head && exec python -m warden.main"
