version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"     # goose Up statements; Down blocks are ignored
    queries: "db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/storage/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          # Map storage types onto the shapes internal/domain uses, so the
          # storage <-> domain conversion stays a plain field copy.
          - db_type: "uuid"
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
