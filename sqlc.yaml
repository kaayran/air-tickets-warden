version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"     # goose Up statements; Down blocks are ignored
    queries: "db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/storage/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
