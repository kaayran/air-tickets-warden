[project]
name = "warden"
version = "0.1.0"
description = "Telegram bot that monitors air ticket prices."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anton Pokidov" }]

dependencies = [
    "aiogram>=3.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "aiohttp>=3.9",
    "sentry-sdk[aiohttp,sqlalchemy]>=1.40",
    "airportsdata>=20260315",
    "aiogram-calendar>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "respx>=0.21",
    "freezegun>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "respx>=0.21",
    "freezegun>=1.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "C4",            # comprehensions
    "PTH",           # pathlib
    "TID",           # tidy imports
    "ASYNC",         # async correctness
]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # cyrillic/latin look-alikes — we use Russian in user-facing strings
    "RUF002", # same, for docstrings
    "RUF003", # same, for comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "C401", "ASYNC109"]
"alembic/versions/*" = ["E501", "I001"]
"alembic/env.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/warden"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "aiogram_calendar.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: integration tests (may hit real services)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:aiogram.*",
]

[tool.coverage.run]
source = ["src/warden"]
branch = true
omit = ["src/warden/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
